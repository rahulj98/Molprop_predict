# Continuous integration: lint and test on every push and pull request.
#
# Why this exists at all. Every check here is one you can already run locally,
# and locally is where you will run them most of the time. What CI adds is that
# they run on a machine that is not yours: a clean checkout, no editable
# install left over from last week, no package you installed once and forgot to
# declare. "Works on my laptop" is a real failure mode for a repository whose
# stated purpose is being cloned and reproduced by someone else, and this is the
# cheapest way to find out before they do.
name: CI

# `push` is limited to main rather than "**". With both triggers unrestricted,
# every push to a branch that has a pull request open runs the whole job twice,
# for one commit, on the same code. This pairing -- pushes to the default
# branch, plus every pull request -- is the combination that covers each commit
# exactly once, whether it arrives directly or through review.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run rather than queueing
# behind it. Nobody needs the result for a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, set explicitly. Without this block the job inherits whatever
# the repository's default is, which for older repositories is a read/write
# GITHUB_TOKEN -- far more than a job that only lints and tests has any use for.
# Narrowing it here means a compromised dependency in the install step cannot
# push to the repository with the token it finds in the environment.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches the pip download directory between runs. Torch alone is a
          # ~200 MB wheel, so this is most of the job's wall time.
          cache: pip

      - name: Install
        # The CPU build of torch, explicitly. The default index resolves to the
        # CUDA wheel, which is ~2.5 GB and would be downloaded on every run to
        # be used by nothing -- the runner has no GPU. This is the same
        # train-on-GPU / test-and-serve-on-CPU asymmetry the Dockerfile makes.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        # No path arguments, so this is exactly the command a reader runs
        # locally. Naming paths here instead would let the two diverge -- and
        # they did: `notebooks/` is excluded in pyproject.toml, and passing
        # `src tests scripts` was hiding that rather than expressing it.
        #
        # Linting only, deliberately. `ruff format --check` is the obvious extra
        # step and is not here yet: adopting the formatter would rewrite twelve
        # files of hand-wrapped code in one commit, which is a decision to make
        # on purpose rather than a side effect of switching CI on.
        run: ruff check

      - name: Test
        # `-m "not docker"` skips the container tests: they need a built image
        # and a running daemon, which this job deliberately does not set up.
        # The dataset-marked tests skip themselves when QM9 is not on disk, so
        # a runner with no 82 MB download still gets a meaningful suite.
        run: pytest -m "not docker" -q
